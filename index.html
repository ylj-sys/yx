<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ylj测试教材 - 教材目录 - 九学王内容中台</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/element-plus/dist/index.css"
    />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <script src="https://unpkg.com/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: linear-gradient(
          135deg,
          #e8eaff 0%,
          #f0eaff 50%,
          #ffeef5 100%
        );
        color: #333;
        font-size: 14px;
      }

      .el-container {
        height: 100vh;
      }

      /* 顶部导航 */
      .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid #e8eaf6;
        padding: 0 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 600;
        color: #222;
      }

      .brand-logo {
        width: 28px;
        height: 28px;
        background: #5b8ff9;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }

      .top-header .el-menu.el-menu--horizontal {
        border-bottom: none;
        background: transparent;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* 侧边栏 */
      .sidebar {
        background: #f7f8ff;
        border-right: 1px solid #e8eaf6;
      }

      .sidebar .el-menu {
        border-right: none;
        background: transparent;
      }

      /* 主内容 */
      .main {
        padding: 20px;
      }

      .content-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(100, 100, 200, 0.08);
        padding: 24px 32px;
        min-height: calc(100vh - 120px);
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .main-title {
        font-size: 22px;
        font-weight: 600;
        color: #222;
      }

      .meta {
        color: #888;
        font-size: 13px;
      }

      .meta .label {
        color: #aaa;
      }

      .filter-section {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin: 20px 0 16px;
      }

      .delete-body {
        padding: 0;
      }

      .delete-title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 16px;
      }

      .delete-options {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .delete-options .el-radio {
        margin-left: 0;
        padding-left: 0;
      }

      .delete-options .el-radio__input {
        margin-left: 0;
      }

      .filter-left {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .filter-label {
        color: #666;
        font-size: 14px;
        margin-right: 4px;
      }

      .scene-filter .el-radio {
        margin-right: 16px;
      }

      .scene-filter .el-radio__input {
        display: none;
      }

      .scene-filter .el-radio__label {
        padding-left: 0 !important;
        font-size: 14px;
        color: #666;
      }

      .scene-filter .el-radio.is-checked .el-radio__label {
        color: #5b8ff9;
        font-weight: 600;
      }

      .scene-filter .el-radio:hover .el-radio__label {
        color: #5b8ff9;
      }

      .action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .action-bar .action-left,
      .action-bar .action-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .action-bar .btn-icon {
        display: inline-flex;
        vertical-align: middle;
      }

      /* 树状目录：去除表格外框 / 斑马纹 / 行分隔线，但保留表头 */
      .el-table {
        --el-table-row-hover-bg-color: #f5f7fa;
        --el-table-border-color: transparent;
        --el-table-bg-color: transparent;
        font-size: 14px;
        color: #333;
        background: transparent;
      }

      /* 表头：浅灰蓝底色块 + 灰字，底部一条浅色分隔线（参考目标图） */
      .el-table th.el-table__cell {
        font-weight: 500;
        color: #606266;
        height: 44px;
        padding: 0 12px;
        background: #f5f7fa;
        border-top: none;
        border-bottom: 1px solid #e8eaf0;
      }

      /* 去掉 el-table 自带的外框线与顶部底线 */
      .el-table::before,
      .el-table::after,
      .el-table__inner-wrapper::before,
      .el-table__inner-wrapper::after {
        display: none;
      }

      .el-table tr {
        background: transparent;
      }

      .el-table td.el-table__cell {
        padding: 8px;
        background: transparent;
        /* 行与行之间仅保留一条极浅分隔线（参考目标样式） */
        border-bottom: 1px solid #f2f4f7;
      }

      .el-table .el-table__row:hover > td.el-table__cell {
        background: #f5f7fa;
      }

      /* 层级缩进引导线（虚线）：对齐上级展开图标中心，呈现树的层级关系 */
      .el-table td.el-table__cell:first-child .cell {
        overflow: visible;
      }

      .el-table .el-table__indent {
        position: relative;
        flex: none;
      }

      .el-table .el-table__indent::before {
        content: "";
        position: absolute;
        left: 8px;
        top: -10px;
        bottom: -10px;
        border-left: 1px dashed #d0d3dc;
      }

      /* 展开/收起图标：蓝色圆形 + / − */
      .el-table .el-table__expand-icon {
        position: relative;
        width: 20px;
        height: 20px;
        margin-right: 6px;
        border-radius: 50%;
        background: #3f7ef7;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        /* 覆盖默认箭头的旋转动画 */
        transform: none;
        transition: none;
      }

      .el-table .el-table__expand-icon:hover {
        background: #5b8ff9;
      }

      /* 隐藏默认箭头，用伪元素绘制 + / − */
      .el-table .el-table__expand-icon .el-icon {
        display: none;
      }

      /* 横线：始终显示，展开后即为 − */
      .el-table .el-table__expand-icon::before {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        top: 50%;
        height: 1.6px;
        border-radius: 1px;
        transform: translateY(-50%);
        background: #fff;
      }

      /* 竖线：收起时与横线组成 + */
      .el-table .el-table__expand-icon::after {
        content: "";
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 50%;
        width: 1.6px;
        border-radius: 1px;
        transform: translateX(-50%);
        background: #fff;
      }

      .el-table .el-table__expand-icon--expanded::after {
        display: none;
      }

      /* 操作列 */
      .el-table .el-button.is-link {
        padding: 0;
        height: auto;
        font-size: 14px;
      }

      /* 操作列：按钮横向排列并用 gap 控制间距（tooltip 包裹的删除按钮也能生效） */
      .el-table td.el-table__cell:last-child .cell {
        display: inline-flex;
        align-items: center;
        gap: 16px;
      }

      .el-table .el-button.is-link.el-button--primary {
        color: #5b8ff9;
      }

      .el-table .el-button.is-link.el-button--danger {
        color: #ff4d4f;
      }

      .el-table .el-button.is-link.el-button--danger.is-disabled,
      .el-table .el-button.is-link.el-button--danger:disabled {
        color: #c0c4cc;
        cursor: not-allowed;
        /* 禁用态不再接收鼠标事件，交由外层包裹元素触发 tooltip */
        pointer-events: none;
      }

      .op-disabled-wrap {
        display: inline-flex;
        align-items: center;
        cursor: not-allowed;
      }

      .el-table .cell {
        line-height: 22px;
      }

      /* 名称列：展开/收起图标与章节名称保持在同一行 */
      .el-table td.el-table__cell:first-child .cell {
        display: flex;
        align-items: center;
      }

      .el-table td.el-table__cell:first-child .cell .el-input {
        flex: 1;
        min-width: 0;
        width: auto;
      }

      /* 名称列行内编辑输入框：占满单元格；默认无边框，呈现为纯文本节点 */
      .el-table .cell .el-input {
        width: 100%;
      }

      /* 名称输入框常显：浅灰边框 + 白底，无需 hover 即呈现 */
      .el-table .cell .el-input .el-input__wrapper {
        box-shadow: 0 0 0 1px #dcdfe6 inset;
        background: #fff;
        padding: 1px 10px;
        border-radius: 4px;
        transition: box-shadow 0.15s;
      }

      .el-table .cell .el-input .el-input__inner {
        height: 28px;
        line-height: 28px;
      }

      /* hover / 聚焦时边框转为蓝色 */
      .el-table .cell .el-input:hover .el-input__wrapper,
      .el-table .cell .el-input.is-focus .el-input__wrapper {
        box-shadow: 0 0 0 1px #a0cfff inset;
        background: #fff;
      }

      /* 层级区分：父级（含子章节）加粗深色，子级常规色 */
      .el-table .el-table__row.is-branch .cell .el-input .el-input__inner,
      .el-table .el-table__row.is-branch .cell .tree-node-name {
        font-weight: 600;
        color: #303133;
      }

      .el-table .el-table__row.is-leaf .cell .el-input .el-input__inner,
      .el-table .el-table__row.is-leaf .cell .tree-node-name {
        font-weight: 400;
        color: #606266;
      }

      /* 只读目录（题库目录 / 教材知识树目录）的名称：纯文本节点 */
      .el-table td.el-table__cell:first-child .cell .tree-node-name {
        flex: 1;
        min-width: 0;
        height: 28px;
        line-height: 28px;
        padding-left: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 拖拽手柄 */
      .drag-handle {
        cursor: grab !important;
        padding: 0 4px;
      }

      .drag-handle:hover span {
        color: #5b8ff9 !important;
      }

      .drag-handle:active {
        cursor: grabbing !important;
      }

      /* 拖拽视觉（参考 course-list）：蓝色插入参考线（上/下）+ 拖拽原位半透明 */
      .el-table__row.drop-prev > td {
        box-shadow: inset 0 2px 0 0 #1890ff;
      }

      .el-table__row.drop-next > td {
        box-shadow: inset 0 -2px 0 0 #1890ff;
      }

      /* 放到目标目录子级下：整行浅蓝高亮 */
      .el-table__row.drop-target > td.el-table__cell {
        background-color: #ecf5ff !important;
      }

      .el-table__row.drag-ghost {
        opacity: 0.35;
      }

      /* 拖拽残影：只显示源目录名称，无边框无底色 */
      .drag-float-ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3000;
        pointer-events: none;
        max-width: 320px;
        padding: 0 6px;
        font-size: 14px;
        font-weight: 500;
        line-height: 28px;
        color: #303133;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.55;
      }

      /* 拖拽进行中：禁止选中文本，光标保持抓手 */
      body.tree-dragging {
        user-select: none;
        cursor: grabbing;
      }

      body.tree-dragging .el-table__row:hover > td.el-table__cell {
        background: transparent;
      }

      /* 抽屉树中禁用勾选的节点（已挂载试题 / 知识点） */
      .el-tree-node.is-disabled .el-tree-node__label,
      .el-tree .el-tree-node__content.is-disabled .el-tree-node__label {
        color: #a8abb2;
        cursor: not-allowed;
      }

      /* 题库目录关联区 */
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .panel-title {
        font-size: 16px;
        font-weight: 600;
        color: #303133;
      }

      .qb-block {
        margin-top: 4px;
      }

      .drawer-custom-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid #ebeef5;
        margin-bottom: 16px;
      }

      .drawer-header-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }

      .drawer-title {
        font-size: 18px;
        font-weight: 600;
        color: #303133;
        line-height: 1.4;
        padding-right: 12px;
        white-space: nowrap;
      }

      .drawer-tip {
        color: #888;
        font-size: 13px;
        line-height: 1.4;
      }

      .drawer-close {
        padding: 0;
        height: auto;
        color: #606266;
      }

      .drawer-close:hover {
        color: #5b8ff9;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <el-container>
        <!-- 顶部导航 -->
        <el-header class="top-header" height="56px">
          <div class="brand">
            <span class="brand-logo">九</span>
            <span>九学王内容中台</span>
          </div>
          <el-menu mode="horizontal" :default-active="'1'">
            <el-menu-item index="1">知识体系</el-menu-item>
            <el-menu-item index="2">属性与...</el-menu-item>
            <el-menu-item index="3">映射...</el-menu-item>
            <el-menu-item index="4">内容资...</el-menu-item>
            <el-menu-item index="5">开放...</el-menu-item>
          </el-menu>
          <div class="header-right">
            <el-button text>接口文档</el-button>
            <el-button text>工作台</el-button>
            <el-avatar style="background: #d9e6ff; color: #5b8ff9"
              >易</el-avatar
            >
          </div>
        </el-header>

        <el-container>
          <!-- 侧边栏 -->
          <el-aside width="200px" class="sidebar">
            <el-menu :default-active="'1-1'">
              <el-sub-menu index="1">
                <template #title>教材管理</template>
                <el-menu-item index="1-1">教材列表</el-menu-item>
              </el-sub-menu>
              <el-sub-menu index="2">
                <template #title>学科知识体系</template>
              </el-sub-menu>
              <el-sub-menu index="3">
                <template #title>考点知识体系</template>
              </el-sub-menu>
              <el-sub-menu index="4">
                <template #title>教材知识体系</template>
              </el-sub-menu>
            </el-menu>
          </el-aside>

          <!-- 主内容 -->
          <el-main class="main">
            <div class="content-card">
              <!-- 面包屑 -->
              <el-breadcrumb separator="/">
                <el-breadcrumb-item>教材管理</el-breadcrumb-item>
                <el-breadcrumb-item>教材列表</el-breadcrumb-item>
                <el-breadcrumb-item>ylj测试教材</el-breadcrumb-item>
                <el-breadcrumb-item>教材目录</el-breadcrumb-item>
              </el-breadcrumb>

              <!-- 标题区 -->
              <div style="margin-top: 16px">
                <div class="title-row">
                  <h1 class="main-title">ylj测试教材</h1>
                  <span class="meta"
                    ><span class="label">ID：</span>2100403436108382210</span
                  >
                  <span class="meta"
                    ><span class="label">中台版本：</span>1.3</span
                  >
                </div>
                <el-tabs v-model="activeTab">
                  <el-tab-pane label="基本信息" name="basic"></el-tab-pane>
                  <el-tab-pane label="教材目录" name="catalog"></el-tab-pane>
                  <el-tab-pane
                    label="题库目录"
                    name="questionbank"
                  ></el-tab-pane>
                  <el-tab-pane
                    label="教材知识树目录"
                    name="knowledge"
                  ></el-tab-pane>
                </el-tabs>
              </div>

              <!-- 教材目录 -->
              <template v-if="activeTab === 'catalog'">
                <!-- 操作按钮 -->
                <div class="action-bar">
                  <div class="action-left">
                    <el-button type="primary" @click="openDialog()">
                      <svg
                        class="btn-icon"
                        viewBox="0 0 24 24"
                        width="14"
                        height="14"
                        fill="currentColor"
                        style="margin-right: 4px"
                      >
                        <path d="M12 5v7H5v1h7v7h1v-7h7v-1h-7V5h-1z" />
                      </svg>
                      添加章节
                    </el-button>
                    <el-button @click="downloadTemplate()">
                      <svg
                        class="btn-icon"
                        viewBox="0 0 24 24"
                        width="14"
                        height="14"
                        fill="currentColor"
                        style="margin-right: 4px"
                      >
                        <path
                          d="M12 15l-4.5-4.5H11V4h2v6.5h3.5L12 15zm-7 3v1h14v-1H5z"
                        />
                      </svg>
                      下载导入模板
                    </el-button>
                  </div>
                  <div class="action-right">
                    <el-input
                      v-model="searchKeyword"
                      placeholder="请输入章节名称"
                      clearable
                      style="width: 220px"
                    >
                      <template #prefix>
                        <svg
                          viewBox="0 0 24 24"
                          width="14"
                          height="14"
                          fill="#909399"
                        >
                          <path
                            d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 0 0 16 9.5 6.5 6.5 0 0 0 9.5 3 6.5 6.5 0 0 0 3 9.5a6.5 6.5 0 0 0 6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                          />
                        </svg>
                      </template>
                    </el-input>
                    <el-button @click="exportTree()">
                      <svg
                        class="btn-icon"
                        viewBox="0 0 24 24"
                        width="14"
                        height="14"
                        fill="currentColor"
                        style="margin-right: 4px"
                      >
                        <path
                          d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"
                        />
                      </svg>
                      导出目录
                    </el-button>
                  </div>
                </div>

                <!-- 表格 -->
                <el-table
                  ref="tableRef"
                  :data="filteredData"
                  indent="28"
                  row-key="id"
                  :tree-props="{ children: 'children' }"
                  :expand-row-keys="expandedKeys"
                  :row-class-name="rowClassName"
                  style="width: 100%"
                >
                  <el-table-column
                    prop="name"
                    label="目录"
                    min-width="280"
                  >
                    <template #default="{ row }">
                      <el-input
                        v-model="row.name"
                        placeholder="请输入章节名称"
                        @blur="saveRowName(row)"
                      ></el-input>
                    </template>
                  </el-table-column>
                  <el-table-column
                    prop="level"
                    label="层级"
                    width="120"
                    align="right"
                    :formatter="formatLevel"
                  ></el-table-column>
                  <el-table-column
                    prop="id"
                    label="ID"
                    width="140"
                    align="right"
                  ></el-table-column>
                  <el-table-column label="操作" width="300" align="center" header-align="center">
                    <template #default="{ row }">
                      <el-button link type="primary" @click="addChild(row)"
                        >添加子章节</el-button
                      >
                      <el-tooltip
                        :content="canDeleteTextbook(row) ? '' : '该章节已被业务引用，无法删除，请先解除关联'"
                        :disabled="canDeleteTextbook(row)"
                        placement="top"
                      >
                        <span
                          :class="{ 'op-disabled-wrap': !canDeleteTextbook(row) }"
                        >
                          <el-button
                            link
                            type="danger"
                            :disabled="!canDeleteTextbook(row)"
                            @click="deleteRow(row)"
                            >删除</el-button
                          >
                        </span>
                      </el-tooltip>
                      <el-button
                        link
                        class="drag-handle"
                        title="按住拖拽排序"
                        @click
