<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>九学王内容中台 · 内容资产库 · 视频上传</title>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4.4.5/dist/vue-router.global.prod.js"></script>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.8/dist/index.css" />
<script src="https://unpkg.com/element-plus@2.8.8/dist/index.full.min.js"></script>
<style>
  :root{
    --primary:#409eff;
    --primary-hover:#338eec;
    --btn-blue:#409eff;
    --text-1:#1f2430;
    --text-2:#3a4353;
    --text-3:#7d8798;
    --line:#eff2f6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    font-size:16px;
    color:var(--text-2);
    background:
      url('body-bg.jpg') center top / cover no-repeat fixed,
      linear-gradient(180deg,#eaf1fb 0%,#f4f9fe 58%,#fbfdff 100%);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{height:100%;}

  .shell{display:flex;flex-direction:column;height:100%;}

  /* ================= 顶部导航 ================= */
  .topbar{
    height:72px;flex:0 0 72px;display:flex;align-items:center;
    padding:0 18px 0 24px;background:transparent;position:relative;z-index:2;
  }
  .logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#1f2430;white-space:nowrap;}
  .logo .mark{
    width:24px;height:24px;border-radius:6px;flex:0 0 24px;
    background:conic-gradient(from 205deg,#2b7cff,#22b6e0,#7a5fd0,#2b7cff);
  }
  .topnav{display:flex;align-items:center;gap:29px;flex:1;height:100%;margin-left:29px;min-width:0;}
  .nav-item{
    position:relative;display:inline-flex;align-items:center;gap:6px;height:100%;
    font-size:16px;color:var(--text-2);cursor:pointer;white-space:nowrap;
  }
  .nav-item:hover{color:#00b389;}
  .nav-item.is-active{color:#00b389;font-weight:600;}
  .nav-item.is-active::after{
    content:"";position:absolute;left:24px;right:5px;bottom:6px;
    height:2px;border-radius:2px;background:#00b389;
  }
  .nav-ico{display:inline-flex;width:18px;height:18px;color:#7f8899;}
  .nav-ico svg{width:18px;height:18px;display:block;}
  .nav-item:hover .nav-ico{color:#00b389;}
  .nav-more{color:#98a1b0;letter-spacing:1px;cursor:pointer;font-size:17px;}

  .topbar-right{display:flex;align-items:center;gap:12px;}
  .pill{
    height:31px;padding:0 19px;border:1px solid #dce1e9;border-radius:17px;background:#fff;
    font-size:16px;color:var(--text-2);cursor:pointer;font-family:inherit;
  }
  .pill:hover{border-color:var(--primary);color:var(--primary);}
  .help{display:inline-flex;width:22px;height:22px;color:#94a0b1;cursor:pointer;}
  .help svg{width:22px;height:22px;display:block;}
  .help:hover{color:var(--primary);}
  .user{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .avatar{
    width:29px;height:29px;border-radius:50%;flex:0 0 29px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;color:#8a5a2b;
    background:linear-gradient(145deg,#ffe0c9,#e8ac82);
  }
  .uname{color:var(--text-2);}

  /* ================= 主体 ================= */
  .layout{flex:1;display:flex;min-height:0;}

  .sidebar{width:198px;flex:0 0 198px;padding:6px 0 17px;overflow-y:auto;}
  .menu-item{display:flex;align-items:center;justify-content:space-between;
    height:48px;padding:0 19px 0 31px;margin:0 14px;
    font-size:16px;color:var(--text-2);cursor:pointer;border-radius:10px;}
  .menu-item.group{font-weight:400;color:var(--text-1);}
  .menu-item:hover{color:var(--primary);}
  .menu-item.group:hover{color:var(--text-1);}
  .menu-item.sub{padding-left:46px;}
  .menu-item.current{
    color:#00b389;font-weight:600;background:#fff;border-radius:22px;
  }
  .menu-item.current:hover{color:#00b389;}
  .menu-item.group-open,.menu-item.group-open:hover{color:#00b389;}
  .chev{display:inline-flex;color:#c0c7d3;transition:transform .18s;}
  .chev svg{width:12px;height:12px;display:block;}
  .chev.open{transform:rotate(180deg);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 18px 14px 0;overflow-x:hidden;overflow-y:auto;}

  .page-card{
    flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(19,45,80,.05);
  }

  .breadcrumb{padding:34px 22px 17px;font-size:16px;color:#98a1ae;display:flex;gap:8px;flex-wrap:wrap;}
  .breadcrumb .sep{color:#ccd3dd;}

  .tabs{
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 22px;margin-top:6px;
  }
  .tabs-left{display:flex;gap:34px;}
  .tab{position:relative;padding:13px 1px 13px;font-size:17px;color:var(--text-2);cursor:pointer;}
  .tab:hover{color:var(--primary);}
  .tab.is-active{color:var(--primary);font-weight:600;}
  .tab.is-active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    border-radius:2px;background:var(--primary);
  }
  .tabs-right{
    display:inline-flex;align-items:center;gap:4px;padding-bottom:14px;
    font-size:14px;color:#8d96a4;cursor:pointer;
  }
  .tabs-right:hover{color:var(--primary);}
  .tabs-right > span{display:inline-flex;}
  .tabs-right svg{width:16px;height:16px;display:block;}

  .page-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:13px 17px 0;overflow-y:auto;}
  .page-body>*{flex-shrink:0;}

  .sec-title{
    position:relative;display:flex;align-items:center;gap:7px;
    padding-left:11px;margin-left:5px;line-height:24px;
    font-size:16px;font-weight:600;color:var(--text-1);
  }
  .sec-title::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:4px;height:16px;border-radius:2px;background:var(--primary);
  }
  .sec-title.mt-lg{margin-top:30px;}
  .sec-title .q{display:inline-flex;color:#a7b0be;cursor:help;}
  .sec-title .q svg{width:16px;height:16px;display:block;}

  /* 上传说明气泡 */
  .up-tip-title{position:relative;padding-left:10px;line-height:22px;margin-bottom:10px;
    font-size:16px;font-weight:600;color:var(--text-1);}
  .up-tip-title::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:4px;height:16px;border-radius:2px;background:var(--btn-blue);}
  .up-tip-body{font-size:15px;line-height:26px;color:var(--text-2);white-space:pre-line;}

  /* Element Plus 选择框：输入框与下拉选项文字 16px */
  .el-select .el-select__wrapper{font-size:16px;}
  .el-select .el-select__placeholder{font-size:16px;}
  .el-select .el-input__inner{font-size:16px;}
  .el-select__popper .el-select-dropdown__item{font-size:16px;}
  .el-popper .el-select-dropdown__item{font-size:16px;}

  .btn-primary{
    margin-top:12px;display:inline-flex;align-items:center;justify-content:center;
    height:31px;padding:0 13px;border:0;border-radius:4px;
    background:var(--btn-blue);color:#fff;font-size:16px;font-family:inherit;
    cursor:pointer;transition:background .2s;
  }
  .btn-primary:hover{background:var(--primary-hover);}

  /* ================= 上传区（上传页） ================= */
  .upload-zone{
    flex:1 1 auto;min-height:372px;margin-top:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid #e6ebf2;border-radius:5px;background:#fff;
    transition:border-color .2s,background .2s;padding:24px;
  }
  .upload-zone:hover{border-color:#a6c4f8;background:#fcfdff;}
  .upload-zone.dragging{border-color:var(--primary);background:#f4f9ff;}

  /* 视频上传区缩小 + 视频页身不撑满（取消按钮上移） */
  .upload-zone.uz-sm{min-height:196px;}
  .page-body.vuz-body{flex:0 1 auto;}
  /* 白色卡片高度收缩为内容高度（不压缩，超出由页面滚动） */
  .page-card.card-hug{flex:0 0 auto;}

  /* 需求说明（卡片下方，复用编辑页 req-panel 米黄面板样式） */
  .req-note{margin-top:14px;flex:0 0 auto;}

  .upload-empty{text-align:center;padding-bottom:22px;}
  .cloud{display:inline-flex;margin-bottom:13px;}
  .cloud svg{width:50px;height:50px;display:block;}
  .upload-empty .tip{font-size:14px;color:#8b96a8;}
  .upload-empty .hint{margin-top:13px;font-size:14px;color:#8b96a8;}

  /* 已选文件列表（上传页） */
  .file-list{width:100%;max-width:792px;display:flex;flex-direction:column;gap:12px;}
  .file-row{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    border:1px solid var(--line);border-radius:5px;background:#fafbfd;
  }
  .ftag{
    flex:0 0 41px;height:26px;border-radius:4px;background:#e8f1ff;color:#2b7cff;
    font-size:12px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.6px;
  }
  .fmain{flex:1;min-width:0;}
  .fname{font-size:16px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fbar{height:5px;border-radius:5px;background:#e9edf4;margin-top:8px;overflow:hidden;}
  .fbar i{display:block;height:100%;border-radius:5px;background:var(--btn-blue);transition:width .25s;}
  .fsize{flex:0 0 auto;font-size:14px;color:#9aa3b2;}
  .fdel{flex:0 0 auto;font-size:14px;color:#9aa3b2;cursor:pointer;}
  .fdel:hover{color:#f0564a;}
  .file-list .btn-primary{align-self:center;margin-top:2px;}

  /* ================= 上传成功页 ================= */
  .success-page{padding-bottom:7px;}
  .add-btn{margin:12px 0 0 5px;align-self:flex-start;}
  /* 批量编辑弹窗：仅展示成功页的「内容标签」整个区域，隐藏其它部分 */
  .batch-edit-embed .breadcrumb,
  .batch-edit-embed .vtype-bar,
  .batch-edit-embed .sec-title:not(.mt-lg),
  .batch-edit-embed .add-btn,
  .batch-edit-embed .file-el-table,
  .batch-edit-embed .page-footer{display:none !important;}
  .batch-edit-embed .page-body{margin-top:0;}
  /* 弹窗内去除文件切换卡片与「批量编辑」勾选框 */
  .batch-edit-embed .vtag-cards,
  .batch-edit-embed .batch-edit{display:none !important;}
  /* 弹窗：选择参与批量的标签字段 */
  .batch-fields{border:1px solid #ebeef5;border-radius:8px;padding:12px 16px;margin-bottom:14px;background:#fafbfc;}
  .batch-fields .bf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .batch-fields .bf-title{font-size:15px;font-weight:600;color:#1d2129;}
  .batch-fields .bf-acts .el-button{padding-left:4px;padding-right:4px;font-size:13px;}
  .batch-fields .bf-opts{display:flex;flex-wrap:wrap;gap:8px 22px;}
  .batch-fields .bf-opt{display:flex;align-items:center;gap:6px;font-size:14px;color:#4e5969;cursor:pointer;user-select:none;}
  .batch-fields .bf-opt input{accent-color:var(--el-color-primary);width:15px;height:15px;}
  /* 讲师信息卡片：展示态（值 + 编辑链接），编辑走「选择讲师」弹窗 */
  .vtag-card .tc-row{display:flex;align-items:center;gap:12px;padding:2px 0;margin-left:11px;}
  .vtag-card .tc-val{font-size:14px;color:#1d2129;}
  .vtag-card .tc-link{color:var(--primary);font-size:14px;cursor:pointer;}
  .vtag-card .tc-caret{width:12px;height:12px;margin-left:2px;vertical-align:-1.5px;}
  .vtag-card .tc-slash{color:#1d2129;margin:0 5px;}
  .vtag-card .tc-edit{color:var(--primary);font-size:14px;cursor:pointer;flex:0 0 auto;}
  .vtag-card .tc-name,.vtag-card .tc-pop-name{cursor:pointer;}
  .tc-tip{font-size:13px;}
  /* 讲师详情抽屉 */
  .td-head{display:flex;align-items:center;gap:14px;}
  .td-avatar{width:52px;height:52px;border-radius:50%;background:#f2f5fa;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#b6bdca;}
  .td-name{font-size:17px;font-weight:600;color:#1d2129;}
  .td-sex{font-style:normal;font-weight:400;font-size:14px;color:#4e5969;margin-left:6px;}
  .td-intro{font-size:14px;color:#4e5969;line-height:22px;margin:14px 0 20px;}
  .td-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px;}
  .td-item{font-size:14px;line-height:20px;}
  .td-item .td-lb{color:#8b93a3;margin-right:8px;}
  .td-item .td-val{color:#1d2129;word-break:break-all;}
  .td-certs{margin-top:20px;}
  .td-certs-lb{font-size:14px;color:#8b93a3;margin-bottom:10px;}
  .td-certs-imgs{display:flex;gap:12px;}
  .td-cert{width:64px;height:84px;border:1px solid #e8edf4;border-radius:4px;background:#fafbfc;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#b6bdca;}
  .tc-pop .tc-pop-item{font-size:14px;color:#4e5969;line-height:26px;}
  /* 选择讲师弹窗 */
  .tp-filters{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .tp-filters .tp-flb{font-size:14px;color:#1d2129;white-space:nowrap;}
  .tp-table .tp-avatar{display:inline-block;min-width:40px;text-align:center;font-size:13px;color:#b6bdca;background:#f2f5fa;border-radius:4px;padding:2px 8px;}
  .tp-table .tp-chk{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
  .tp-table .tp-chk:disabled{cursor:not-allowed;opacity:.5;}
  .tp-page{display:flex;justify-content:center;margin-top:12px;}
  .tp-count{margin-right:12px;font-size:14px;color:#4e5969;}

  /* 内容标签：批量编辑勾选框 */
  .sec-title .batch-edit{margin-left:auto;font-weight:400;}
  /* 批量编辑确认气泡 */
  .batch-pop .batch-pop-tt{font-size:16px;font-weight:600;color:#1d2129;margin-bottom:10px;}
  .batch-pop .batch-pop-txt{font-size:16px;line-height:1.7;color:#4e5969;}
  .batch-pop .batch-pop-act{margin-top:14px;display:flex;gap:10px;}
  /* 内容标签：当前视频蓝色标签框（对齐参考样式 tag-card.active / tag-name） */
  .vtag-cur{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:rgb(79,134,247);border:1px solid rgb(79,134,247);border-radius:4px;margin:10px 0 0 5px;width:250px;min-height:96px;padding:28px 20px 0;color:rgb(255,255,255);}
  /* 视频内容标签：蓝卡（当前文件）+ 灰卡（其他文件），点击灰卡切换 */
  .vtag-cards{display:flex;gap:24px;}
  .vtag-cards .vtag-cur{margin:10px 0 0;cursor:pointer;}
  .vtag-cur.vtag-cur-gray{background:#f4f6fa;border-color:#f4f6fa;}
  .vtag-cur.vtag-cur-gray .vtag-cur-name{color:#4e5969;}
  .vtag-cur.vtag-cur-gray .vtag-cur-no{border-color:#4e5969;color:#4e5969;}
  .vtag-cur-name{display:flex;gap:8px;align-items:center;overflow:hidden;white-space:nowrap;color:rgb(255,255,255);font-size:16px;}
  .vtag-cur-no{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.9);color:#fff;font-size:15px;display:inline-flex;align-items:center;justify-content:center;}
  /* 音频内容标签蓝卡：大号序号/文字 + 底部居中小尾巴 */
  .vtag-cur.atag{position:relative;border-radius:1px solid;}
  .vtag-cur.atag::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:rgb(79,134,247);border-bottom:none;}
  .vtag-cur.atag .vtag-cur-no{width:16px;height:16px;font-size:16px;}
  .vtag-cur.atag .vtag-cur-name{font-size:16px;gap:10px;}
  /* 音频灰卡（其他文件）：去蓝底/隐藏小尾巴 */
  .vtag-cur.atag.vtag-cur-gray{background:#f2f3f7;border-color:#f2f3f7;}
  .vtag-cur.atag.vtag-cur-gray::after{display:none;}
  .vtag-cur.atag.vtag-cur-gray .vtag-cur-name{color:#4e5969;}
  .vtag-cur.atag.vtag-cur-gray .vtag-cur-no{border-color:#4e5969;color:#4e5969;}
  /* 图片内容标签蓝卡：名称下方副标题（未选择标签） */
  .vtag-cur-sub{font-size:13px;color:rgba(255,255,255,.92);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 图片蓝卡：文字偏上，卡片与下方表单留间距 */
  .vtag-cur.itag{padding:14px 20px 0;margin:10px 0 14px 5px;}
  /* 图片灰卡（其他文件） */
  .vtag-cur.itag.vtag-cur-gray{background:#f2f3f7;border-color:#f2f3f7;}
  .vtag-cur.itag.vtag-cur-gray .vtag-cur-name{color:#4e5969;}
  /* 图片标签表单：词条类型选择框文字 14px */
  .imgtag-form .el-select__placeholder,.imgtag-form .el-select__selected-item,.imgtag-form .el-input__inner{font-size:14px;}
  /* 图片标签表单：行距收窄 */
  .imgtag-form .el-form-item{margin-bottom:16px;}
  /* 作者类型：图片类型与朝代同行 */
  .imgtag-form .form-row{display:flex;gap:40px;}
  /* 学案版本：两栏选择面板 */
  .ver-pop{padding:0 !important;}
  .ver-panel{display:flex;min-height:280px;}
  .ver-left{width:240px;border-right:1px solid #f0f0f0;padding:8px 0;}
  .ver-item{padding:12px 24px;font-size:15px;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .ver-item:hover{background:#f5f7fa;}
  .ver-item.active{background:#ecf5ff;color:var(--el-color-primary);}
  .ver-item .arr{color:var(--el-color-primary);}
  .ver-right{flex:1;padding:20px 28px;}
  .ver-opt{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
  .ver-opt .el-checkbox{margin-right:0;}
  .ver-opt .el-checkbox__label{font-size:16px;color:#333;}
  .ver-meta{color:#9aa3b2;font-size:14px;}
  /* 古诗文应用场景：按钮式多选（白底描边） */
  .scene-btns .el-checkbox-button{margin-right:12px;}
  .scene-btns .el-checkbox-button__inner{border:1px solid #dcdfe6;border-radius:4px;font-size:14px;line-height:22px;font-weight:400;color:#1d2129;padding:4px 20px;}
  .scene-btns .el-checkbox-button:first-child .el-checkbox-button__inner{border-left:1px solid #dcdfe6;border-radius:4px;}
  .scene-btns .el-checkbox-button:last-child .el-checkbox-button__inner{border-radius:4px;}
  .scene-btns .el-checkbox-button.is-checked .el-checkbox-button__inner{color:#fff;border-color:var(--el-color-primary);background-color:var(--el-color-primary);box-shadow:none;}
  /* 单选按钮版应用场景（古诗文）：与按钮样式一致 */
  .scene-btns .el-radio-button__inner{border:1px solid #dcdfe6;border-radius:4px;font-size:14px;line-height:22px;font-weight:400;color:#1d2129;padding:4px 20px;box-shadow:none !important;}
  .scene-btns .el-radio-button{margin-right:12px;}
  .scene-btns .el-radio-button:first-child .el-radio-button__inner{border-left:1px solid #dcdfe6;border-radius:4px;}
  .scene-btns .el-radio-button:last-child .el-radio-button__inner{border-radius:4px;}
  .scene-btns .el-radio-button.is-active .el-radio-button__inner{color:#fff;border-color:var(--el-color-primary);background-color:var(--el-color-primary);box-shadow:none !important;}
  /* 音频内容标签：标题行右侧操作按钮（批量编辑在新增后） */
  .atag-ops{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .atag-ops .batch-edit{margin-left:10px;}
  .atag-wrap{margin-top:12px;}
  /* 英语词库/古诗文音频：文件卡片与下方标签表单的间距 */
  .wtag-form{margin-top:24px;}

  /* 视频标签：基础信息 / 拓展信息 */
  .vtag-card{border:1px solid #e8edf4;border-radius:8px;background:#fff;padding:16px 10px;margin:14px 0 0 5px;}
  .vtag-head{display:flex;align-items:center;margin-bottom:14px;}
  .vtag-title{position:relative;padding-left:11px;font-size:14px;font-weight:600;color:var(--text-1);}
  .vtag-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:15px;background:var(--primary);}
  .vtag-ops{margin-left:auto;display:flex;gap:10px;}
  .vtag-box{border:1px solid #e3ecfa;border-radius:8px;margin-top:10px;background:#fff;}
  .vtag-box.open{border-color: #5b8ff9;}
  .vtag-item{display:flex;align-items:center;gap:10px;background:#f0f6ff;border-radius:8px;padding:10px 16px;}
  .vtag-box.open .vtag-item{border-radius:7px 7px 0 0;}
  .vtag-no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;
    display:inline-flex;align-items:center;justify-content:center;}
  .vtag-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:#4e5969;font-size:14px;}
  .vtag-act{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:14px;}
  .vtag-link{font-size:14px;color:var(--primary);cursor:pointer;}
  .vtag-del{font-size:14px;color:#f0564a;cursor:pointer;}
  .vtag-form{padding:16px 10px;}
  .vtag-form .el-form-item{margin-bottom:18px;}
  .vtag-form .el-form-item__label{font-size:14px;color:#4e5969;font-weight:400;}
  .vtag-form .el-radio,.vtag-form .el-checkbox,
  .ext-form .el-radio,.ext-form .el-checkbox{color:#4e5969;font-weight:400;}
  .vtag-form .el-input__inner,.vtag-form .el-select__selected-item,
  .ext-form .el-input__inner,.ext-form .el-select__selected-item{color:#4e5969;font-weight:400;}
  .vtag-form .el-select__wrapper,.vtag-form .el-select__placeholder,
  .vtag-form .el-select__selected-item,.vtag-form .el-tree-select .el-input__inner,
  .ext-form .el-select__wrapper,.ext-form .el-select__placeholder,
  .ext-form .el-select__selected-item{font-size:14px;}
  /* 视频类型 / 适用版本 占位符统一颜色（仅空态；选中值不受影响） */
  .vtag-form .el-select__placeholder.is-transparent,.vtag-form .el-tree-select__placeholder.is-transparent,
  .vtag-form .el-cascader__placeholder.is-transparent{color:#a8abb2;}
  .vt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 12px;width:100%;}
  /* 视频类型下拉：弹层与选择框同宽，选项行铺满 */
  .vtype-popper{max-width:400px;}
  .vtype-popper .el-select-dropdown__wrap{max-height:274px;}
  .vtype-popper .el-tree{width:100%;}
  .vtype-popper .el-tree-node{width:100%;}
  .vtype-popper .el-tree-node__content{width:100%;}
  /* 适用版本级联面板 */
  .ver-popper .el-cascader-node{--el-cascader-node-height:40px;}
  .ver-popper .el-cascader-menu:first-of-type .el-cascader-node__prefix{display:none;}
  .ver-node{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:1;}
  .ver-note{margin-left:auto;font-size:13px;color:#86909c;}
  .ext-form .el-form-item{margin-bottom:16px;}
  .ext-form .el-form-item:last-child{margin-bottom:0;}
  .ext-form .el-form-item__label{font-size:14px;color:#4e5969;font-weight:400;}
  .ext-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;width:100%;}

  .file-table{width:100%;margin-top:12px;border-collapse:collapse;font-size:14px;}
  .file-table th{
    background:#f5f7fa;color:#606876;font-weight:500;text-align:left;
    padding:11px 12px;border-bottom:1px solid #eef1f5;white-space:nowrap;
  }
  .file-table td{padding:11px 12px;border-bottom:1px solid #f2f4f8;color:#333;white-space:nowrap;}
  .file-table th:first-child,.file-table td:first-child{padding-left:22px;width:77px;}
  .file-table .cell-name{color:#333;}
  .file-table .cell-size{color:#606876;}
  .file-table .cell-status{color:#2fb45a;}
  .file-table .cell-op a{color:#f0564a;cursor:pointer;}
  .file-table .cell-op a.op-edit{color:var(--primary);}
  .file-table .cell-op a:hover{text-decoration:underline;}

  /* Element Plus 文件表格（视频成功页）：浅蓝表头 + 单元格边框 */
  .file-el-table{--el-table-border-color:#e4ecf6;--el-table-header-bg-color:#f0f7ff;--el-table-row-hover-bg-color:#eef6ff;margin-top:12px;}
  .file-el-table .el-table__row--striped td.el-table__cell{background:#f7faff;}
  .file-el-table .el-table__cell{padding:11px 0;}
  .file-el-table .el-table__cell .cell{padding:0 14px;font-size:16px;}
  .file-el-table th.el-table__cell{font-weight:400;}
  .file-el-table .st-ok{color:#2fb45a;}
  .file-el-table .cover-cell{display:flex;align-items:center;gap:10px;}
  .file-el-table .cover-change{color:var(--primary);font-size:14px;cursor:pointer;}
  .file-el-table .op-del{color:#f0564a;cursor:pointer;}
  /* 内联编辑：始终纯文本样式，不显示输入框 */
  .file-el-table .el-input__wrapper,.file-el-table .el-select__wrapper{
    box-shadow:none !important;background:transparent !important;padding:0;}
  .file-el-table .el-textarea__inner{
    box-shadow:none !important;background:transparent !important;padding:0 0 2px;font-size:16px;
    color:var(--text-1);resize:none;border-radius:0;}
  .file-el-table .el-input__inner,.file-el-table .el-select__placeholder,.file-el-table .el-select__selected-item{font-size:16px;}
  .file-el-table .el-select__wrapper{min-height:32px;}
  /* 名称 / 简介：保持单行不换行，溢出可滑动但不显示滚动条 */
  .file-el-table .el-input__inner{white-space:nowrap;}
  .file-el-table .el-textarea__inner{
    white-space:nowrap;overflow-x:auto;overflow-y:hidden;word-break:keep-all;
    height:24px;line-height:24px;min-height:24px;padding:0;
    scrollbar-width:none;-ms-overflow-style:none;}
  .file-el-table .el-textarea__inner::-webkit-scrollbar{display:none;}

  .cover{
    display:inline-block;width:48px;height:31px;border-radius:2px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#a8d9f2 0%,#5aa7e8 55%,#2f7cf6 100%);
    vertical-align:middle;
  }
  .cover::after{
    content:"";position:absolute;left:53%;top:50%;transform:translate(-50%,-50%);
    border-left:8px solid rgba(255,255,255,.92);
    border-top:5px solid transparent;border-bottom:5px solid transparent;
  }

  /* 表格内下拉（分辨率） */
  .sel{
    height:31px;padding:0 7px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;
    color:#a8abb2;font-size:16px;font-family:inherit;outline:none;cursor:pointer;
  }
  .sel.filled{color:#333;}
  .sel:hover{border-color:#c0c8d4;}

  /* 资源列表空态 */
  .list-empty{
    flex:1 1 auto;min-height:264px;margin:10px 0 17px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px dashed #d2dae7;border-radius:5px;background:#fff;padding:24px;text-align:center;
  }
  .list-empty .tip{font-size:16px;color:#8b96a8;}
  .list-empty .hint{margin-top:11px;font-size:14px;color:#bcc4d0;}

  /* 内容标签：基础信息 / 拓展信息 两栏 */
  .tag-panels{display:flex;align-items:flex-start;gap:17px;margin:14px 0 0 5px;}
  .tag-panel{flex:1;min-width:0;border:1px solid #e8edf4;border-radius:7px;background:#fff;padding:14px 17px 19px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;}
  .panel-title{position:relative;padding-left:11px;line-height:22px;font-size:16px;font-weight:600;color:var(--text-1);}
  .panel-title::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:4px;height:14px;border-radius:2px;background:var(--primary);}
  .panel-acts{display:flex;align-items:center;gap:10px;}
  .btn-ghost{height:29px;padding:0 12px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;
    font-size:14px;color:#5f6875;font-family:inherit;cursor:pointer;transition:.2s;}
  .btn-ghost:hover{color:var(--btn-blue);border-color:var(--btn-blue);}
  .btn-blue{height:29px;padding:0 14px;border:0;border-radius:4px;background:var(--btn-blue);
    color:#fff;font-size:14px;font-family:inherit;cursor:pointer;transition:.2s;}
  .btn-blue:hover{background:var(--primary-hover);}

  .basic-row{margin-top:12px;padding:11px 14px;background:#f2f8ff;border-radius:5px;font-size:14px;color:#333;}
  .basic-line{display:flex;align-items:center;flex-wrap:wrap;gap:5px 17px;}
  .basic-line .q{display:inline-flex;color:var(--btn-blue);}
  .basic-line .q svg{width:16px;height:16px;display:block;}
  .basic-item b{color:var(--btn-blue);font-weight:500;margin-right:2px;}
  .basic-act{margin-left:auto;display:flex;gap:14px;flex:0 0 auto;}
  .basic-act .exp{color:var(--btn-blue);cursor:pointer;}
  .basic-act .del{color:#f0564a;cursor:pointer;}
  .basic-edit{display:flex;flex-wrap:wrap;gap:10px 17px;margin-top:11px;padding-top:11px;border-top:1px dashed #d9e6f8;}
  .basic-edit .fe{display:flex;align-items:center;gap:6px;font-size:16px;}
  .basic-edit .fe b{color:var(--btn-blue);font-weight:500;}
  .basic-edit .sel{height:29px;font-size:16px;}
  .basic-empty{margin-top:12px;padding:17px 14px;border:1px dashed #e2e8f1;border-radius:5px;
    text-align:center;font-size:14px;color:#a8b3c2;}

  .ext-field{display:flex;margin-top:19px;}
  .ext-field.first{margin-top:14px;}
  .ext-label{flex:0 0 94px;font-size:14px;color:#333;padding-top:2px;}
  .ext-label i{color:#f0564a;font-style:normal;margin-right:2px;}
  .opt-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;}
  .opt{display:flex;align-items:center;gap:7px;font-size:14px;color:#333;cursor:pointer;user-select:none;}
  .opt input{accent-color:var(--btn-blue);margin:0;cursor:pointer;}
  .opt.checked span{color:var(--btn-blue);}

  /* ================= 编辑页（音频 · 查看音频） ================= */
  .page-card.edit-mode{background:#eef1f6;}
  .edit-top{display:flex;align-items:center;justify-content:space-between;padding:17px 22px 5px;}
  .back-link{display:inline-flex;align-items:center;gap:8px;font-size:17px;color:#333;cursor:pointer;}
  .back-link:hover{color:var(--btn-blue);}
  .back-ico{display:inline-flex;}
  .back-ico svg{width:19px;height:19px;display:block;}
  .edit-top .acts{display:flex;gap:12px;}
  .btn-plain{height:34px;padding:0 24px;border:1px solid #dcdfe6;border-radius:5px;background:#fff;
    font-size:16px;color:#333;font-family:inherit;cursor:pointer;transition:.2s;}
  .btn-plain:hover{border-color:var(--btn-blue);color:var(--btn-blue);}
  .btn-save{height:34px;padding:0 24px;border:0;border-radius:5px;background:var(--btn-blue);
    color:#fff;font-size:16px;font-family:inherit;cursor:pointer;transition:.2s;}
  .btn-save:hover{background:var(--primary-hover);}

  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;padding:12px 22px 22px;align-items:start;}
  .edit-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:7px;}
  .edit-col{display:flex;flex-direction:column;gap:17px;}
  /* 播放器 + 信息 同一张白色卡片 */
  .top-panel{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:22px;
    background:#fff;border-radius:10px;padding:17px;}

  /* 需求说明（米黄说明面板） */
  .panel-card.req-panel{grid-column:1 / -1;background:#fffbe6;border:1px solid #f6e9c5;border-radius:10px;padding:17px 22px 19px;}
  .req-title{font-size:16px;font-weight:700;color:#c0761a;margin-bottom:6px;}
  .req-list{margin:0;padding:0;list-style:none;}
  .req-list > li{padding-left:28px;text-indent:-29px;font-size:16px;color:#cb9b3d;line-height:2;}
  /* 有序项下的子项（冒号后的说明） */
  .req-sub{margin:2px 0 4px;padding:0 0 0 8px;list-style:disc;}
  .req-sub li{text-indent:0;font-size:14px;color:#8a6d3b;line-height:1.9;}
  .req-panel .atype-row{margin:0 0 7px;}
  .req-panel .atype-row .lb{color:#b98a2e;}

  /* 视频编辑页 */
  .vtabs{display:flex;gap:34px;padding:14px 22px 0;border-bottom:1px solid #f0f2f6;}
  /* 视频上传页：视频类型选择框（替换 tab 行） */
  .vtype-bar{display:flex;align-items:center;gap:12px;padding:14px 22px;}
  .vtype-bar .lb{color:#5a6478;font-size:16px;flex:0 0 auto;}
  .vtab{position:relative;padding:2px 2px 13px;font-size:17px;color:#5a6478;cursor:pointer;user-select:none;}
  .vtab.is-active{color:var(--btn-blue);font-weight:600;}
  .vtab.is-active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--btn-blue);}
  /* 视频播放器：宽度收窄居中，控制条叠加在画面上，进度条贴底 */
  .video-player{position:relative;width:500px;background:#141414;border-radius:10px;overflow:hidden;aspect-ratio:16/9;}
  .vp-screen{position:absolute;inset:0;background:url('video-cover.jpg') center / cover no-repeat;}
  .vp-progress{position:absolute;left:14px;right:14px;bottom:6px;height:4px;background:rgba(255,255,255,.32);border-radius:2px;}
  .vp-bar{position:absolute;left:0;right:0;bottom:16px;height:40px;display:flex;align-items:center;gap:14px;padding:0 17px;color:#ececec;font-size:15px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.45) 100%);}
  .vp-bar .dots{font-size:20px;letter-spacing:1px;cursor:pointer;line-height:1;}
  .vp-bar .sp{flex:1;}
  .vp-bar .pbtn{display:inline-flex;color:#fff;cursor:pointer;}
  .vp-bar .pbtn svg{width:19px;height:19px;display:block;}
  .vi-name{display:flex;align-items:center;gap:12px;font-size:17px;}
  .vi-name .lb{color:#8b93a3;}
  .vi-name .val{color:var(--text-1);font-weight:600;}
  .link-edit{color:var(--btn-blue);font-size:16px;cursor:pointer;user-select:none;}
  .vi-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 34px;margin-top:19px;}
  .vi-grid .lb{width:86px;flex:0 0 86px;}
  .vi-cover{display:flex;gap:22px;align-items:flex-start;}
  .vi-cover > .lb{color:#8b93a3;font-size:16px;width:86px;flex:0 0 86px;}
  .vi-type{display:flex;align-items:center;gap:12px;align-self:start;}
  .vi-type .lb{color:#8b93a3;font-size:16px;white-space:nowrap;}
  .ti-sm{height:38px;width:168px;border:1px solid #e3e8f2;border-radius:7px;padding:0 12px;
    font-family:inherit;font-size:16px;color:var(--text-1);outline:none;}
  .ti-sm:focus{border-color:var(--btn-blue);}
  .cover-box{position:relative;width:204px;height:115px;border-radius:7px;overflow:hidden;
    background:url('video-cover.jpg') center / cover no-repeat;}
  .cover-box .cv-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;opacity:.92;}
  .cover-box .cv-play svg{width:31px;height:31px;display:block;}
  .cover-tag{position:absolute;left:0;right:0;bottom:0;padding:5px 0 4px;background:rgba(0,0,0,.38);
    color:#fff;text-align:center;font-size:13px;line-height:1.5;}
  .cover-tag .tm{display:block;font-size:11px;opacity:.85;}
  .cover-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    background:rgba(0,0,0,.38);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .cover-del svg{width:12px;height:12px;display:block;}
  .cover-empty{width:180px;height:103px;border:1px dashed #d7dce6;border-radius:7px;
    display:flex;align-items:center;justify-content:center;color:#b6bdca;font-size:14px;}
  /* Tab 内容区为白色卡片（面包屑/返回/Tab 在卡外的白底页面上） */
  .page-card.video-edit .top-panel{background:#fff;border-radius:12px;
    box-shadow:0 2px 14px rgba(19,45,80,.05);padding:19px 22px 17px;gap:36px;
    margin:22px 22px 22px;grid-template-columns:auto 1fr;}
  /* 信息区间距整体收紧 */
  .page-card.video-edit .vi-grid{gap:12px 36px;margin-top:12px;}
  .page-card.video-edit .vi-cover{gap:14px;}
  .page-card.video-edit .intro-row{margin-top:12px;}
  .page-card.video-edit .intro-box textarea{min-height:170px;}
  /* 视频简介：白底文本框 + 字数统计在框外右下 */
  .page-card.video-edit .intro-wrap{flex:1;min-width:0;}
  .page-card.video-edit .intro-wrap .intro-box{background:#fff;border-color:#e5e8ef;}
  .page-card.video-edit .intro-wrap .intro-box textarea{padding:12px 14px;}
  .page-card.video-edit .intro-wrap .cnt{position:static;display:block;text-align:right;margin-top:6px;font-size:14px;color:#b6bdca;}
  /* 左列标签两端对齐，冒号纵向对齐 */
  .page-card.video-edit .vi-name .lb,.page-card.video-edit .vi-grid .lb,
  .page-card.video-edit .vi-cover > .lb,.page-card.video-edit .intro-row > .lb{
    text-align:justify;text-align-last:justify;}
  /* 信息网格：冒号与文字、文字与「编辑」统一 12px 间距 */
  .page-card.video-edit .info-item{gap:12px;}
  .page-card.video-edit .info-item .link-edit{margin-left:0;}
  /* 视频名称输入框：参考图样式（降低高度、文字常规字重） */
  .page-card.video-edit .title-box{min-width:320px;max-width:624px;}
  .page-card.video-edit .title-box .title-input{height:44px;font-size:16px;font-weight:400;padding:0 94px 0 14px;}
  .page-card.video-edit .vtabs{border-bottom:0;}
  .page-card.video-edit .req-panel{margin:14px 22px 22px;}
  /* 视频编辑页：下方 视频标签 / 文件格式 / 操作记录 */
  .page-card.video-edit .ve-cols{display:flex;gap:14px;align-items:stretch;margin:14px 22px 0;}
  .ve-cols > .panel-card{margin:0;flex:1;min-width:0;}
  .ve-cols .ve-right{flex:1.15;min-width:0;display:flex;flex-direction:column;gap:14px;}
  .ve-cols .ve-right .panel-card{flex:none;}
  .ve-card-title{position:relative;padding-left:10px;line-height:22px;font-size:15px;font-weight:600;color:#1d2129;}
  .ve-card-title::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:15px;border-radius:2px;background:var(--btn-blue);}
  .ve-sub{border:1px solid #e8edf4;border-radius:8px;padding:12px 14px 14px;margin-top:12px;}
  .ve-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .ve-sec-name{font-size:14px;font-weight:600;color:#1d2129;}
  .ve-sec-ops{display:flex;gap:8px;}
  .ve-tag-form .el-select,.ve-tag-form .el-cascader{width:100% !important;}
  .fmt-table .cell{padding:0 4px;}
  .fmt-table .el-table__body .cell{color:var(--primary);}
  .ve-card .vtag-item{flex-wrap:wrap;row-gap:4px;}
  .ve-card .vtag-lb{flex:0 0 auto;}
  .op-log{margin-top:12px;display:flex;flex-direction:column;gap:9px;}
  .op-row{font-size:14px;color:#4e5969;}

  /* ================= 图片编辑页（查看图片） ================= */
  .img-card{margin:12px 22px 0;background:#fff;border-radius:12px;
    box-shadow:0 2px 14px rgba(19,45,80,.06);padding:5px 22px 22px;}
  .img-card .edit-top{padding:14px 0 10px;}
  .img-main{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;}
  .img-preview{height:348px;border-radius:10px;background:#e9f1fc;
    display:flex;align-items:center;justify-content:center;gap:10px;color:#9aa7b8;font-size:16px;}
  .img-preview svg{width:24px;height:24px;display:block;}
  .img-info .info-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--text-1);}
  .img-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px 31px;margin-top:17px;font-size:16px;}
  .img-meta .lb{color:#8b93a3;}

/* ---------------- 文件上传区（上传页） ---------------- */
const UploadZone = {
  props: {
    accept: { type: String, default: 'video/mp4,.mp4' },
    tip: { type: String, default: '点击上传或拖入文件开始上传' },
    hint: { type: String, default: '' },
    tag: { type: String, default: 'MP4' },
  },
  setup(props) {
    const files = ref([]);
    const dragging = ref(false);
    const fileInput = ref(null);
    let seed = 0;

    const formatSize = (bytes) => {
      if (!bytes) return '—';
      if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(2) + 'GB';
      if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'MB';
      return Math.max(1, Math.round(bytes / 1024)) + 'KB';
    };

    const pick = () => fileInput.value && fileInput.value.click();

    const addFiles = (list) => {
      Array.from(list || []).forEach((raw) => {
        const row = reactive({
          uid: ++seed,
          name: raw.name || '未命名视频.mp4',
          sizeText: formatSize(raw.size),
          progress: 0,
        });
        files.value.push(row);
        const timer = setInterval(() => {
          row.progress = Math.min(100, Math.round(row.progress + Math.random() * 15 + 6));
          if (row.progress >= 100) clearInterval(timer);
        }, 260);
      });
    };

    const onChange = (e) => { addFiles(e.target.files); e.target.value = ''; };
    const onDrop = (e) => { dragging.value = false; addFiles(e.dataTransfer && e.dataTransfer.files); };
    const remove = (row) => { files.value = files.value.filter((f) => f !== row); };

    return { files, dragging, fileInput, pick, onChange, onDrop, remove, icons };
  },
  template: `
    <div class="upload-zone" :class="{ dragging }"
         @click="pick"
         @dragover.prevent="dragging = true"
         @dragleave.prevent="dragging = false"
         @drop.prevent="onDrop">
      <input ref="fileInput" type="file" :accept="accept" multiple hidden @change="onChange" />

      <div v-if="!files.length" class="upload-empty">
        <span class="cloud" v-html="icons.cloud"></span>
        <div class="tip">{{ tip }}</div>
        <button class="btn-primary" @click.stop="pick">＋添加文件</button>
        <div class="hint" v-if="hint">{{ hint }}</div>
      </div>

      <div v-else class="file-list" @click.stop>
        <div class="file-row" v-for="f in files" :key="f.uid">
          <span class="ftag">{{ tag }}</span>
          <div class="fmain">
            <div class="fname">{{ f.name }}</div>
            <div class="fbar"><i :style="{ width: f.progress + '%' }"></i></div>
          </div>
          <span class="fsize">{{ f.progress >= 100 ? '已完成' : f.progress + '%' }} · {{ f.sizeText }}</span>
          <span class="fdel" @click="remove(f)">删除</span>
        </div>
        <button class="btn-primary" @click.stop="pick">＋ 添加文件</button>
      </div>
    </div>
  `,
};

/* 上传说明：随所选类型联动生成。音频/学案/课件/教案共用三行模板（仅类别名/格式/大小/id前缀不同）；
   图片各类别固定文案；视频沿用通用模板 */
const upTipOf = (kind, type) => {
  const tpl = {
    audio: { noun: '音频', fmt: 'mp3、jwmp3两种范围内', size: '500MB', idName: '题目id' },
    lesson: { noun: '学案', fmt: 'pdf、doc、docx三种范围内', size: '500MB', idName: '学案id' },
    courseware: { noun: '课件', fmt: 'ppt、pptx两种范围内', size: '1.0GB', idName: '课件id' },
    plan: { noun: '教案', fmt: 'pdf、doc、docx三种范围内', size: '500MB', idName: '教案id' },
  }[kind];
  if (tpl) {
    return `当前上传文件种类为${type}下专用${tpl.noun}资源，需注意文件格式限制在${tpl.fmt}，文件大小控制在${tpl.size}以内；\n新增上传时可通过内容id_文件名的形式进行命名；\n增加格式时可通过${tpl.idName}_文件名的的形式进行命名；`;
  }
  if (kind === 'image') {
    return '支持批量添加 JPG、PNG、WEBP、GIF、AVIF，单个文件≤20MB。文件及修改保留在本次页面会话中。';
  }
  const meta = {
    video: { noun: '视频', fmt: '.mp4文件', size: '1GB' },
    audio: { noun: '音频', fmt: '.mp3、.wmp3文件', size: '500MB' },
    image: { noun: '图片', fmt: 'JPG、PNG、WEBP、GIF、AVIF格式', size: '20MB' },
    lesson: { noun: '学案', fmt: '.pdf、.doc、.docx文件', size: '500MB' },
    courseware: { noun: '课件', fmt: '.ppt、.pptx文件', size: '1GB' },
    plan: { noun: '教案', fmt: '.pdf、.doc、.docx文件', size: '500MB' },
  }[kind];
  return `当前上传${meta.noun}种类为${type}下专用${meta.noun}资源，需注意${meta.noun}格式限制为 ${meta.fmt}，${meta.noun}大小控制在 ${meta.size} 以内。`;
};

    const row2 = reactive({ name: 'audio2', size: '4.20mb', intro: '', teacher: [], fmt1: 'wav', duration: '01:45', progress: '读取成功' });
    const rows = [row, row2];
    /* 批量编辑：确认后当前文件的基础信息覆盖全部文件 */
    const confirmBatch = () => {
      const srcTags = fileTags[curIdx.value].map((x) => JSON.parse(JSON.stringify(x)));
      fileTags.forEach((arr, i) => {
        if (i !== curIdx.value) { arr.splice(0, arr.length, ...srcTags.map((x) => JSON.parse(JSON.stringify(x)))); }
      });
      batchEdit.value = true; batchVisible.value = false;
    };
    /* 点击批量编辑：已勾选则直接取消（不弹气泡），未勾选则弹出确认 */
    const toggleBatch = () => {
      if (batchEdit.value) { batchEdit.value = false; }
      else { batchVisible.value = true; }
    };
    /* 批量编辑开启时：当前文件覆盖其他文件，且任一修改实时同步到全部文件 */
    watch(
      () => batchEdit.value && JSON.stringify(fileTags[curIdx.value]),
      () => {
        if (!batchEdit.value) return;
        const srcTags = fileTags[curIdx.value].map((x) => JSON.parse(JSON.stringify(x)));
        fileTags.forEach((arr, i) => { if (i !== curIdx.value) { arr.splice(0, arr.length, ...srcTags.map((x) => JSON.parse(JSON.stringify(x)))); } });
      }
    );
    /* ---- 内容标签：每个文件独立的基础信息 ---- */
    const curIdx = ref(0);
    const mkTag = (id) => ({ id, open: true, xd: '小学', xk: '', grade: '' });
    const fileTags = reactive(rows.map(() => [mkTag(1)]));
    const tags = computed(() => fileTags[curIdx.value]);   // 当前文件的基础信息
    let tagSeq = 1;
    const addTag = () => {
      tagSeq += 1;
      const nt = mkTag(tagSeq);
      /* 批量编辑开启时，新增一套标签同步到全部文件 */
      if (batchEdit.value) fileTags.forEach((arr) => arr.push(JSON.parse(JSON.stringify(nt))));
      else tags.value.push(nt);
    };
    const delTag = (i) => {
      /* 至少保留一套标签信息 */
      if (tags.value.length <= 1) { ElMsg.warning('至少保留一套标签信息'); return; }
      tags.value.splice(i, 1);
    };
    const setAllTags = (open) => tags.value.forEach((t) => { t.open = open; });
    /* 学段切换：学科/年级联动重置（清空，不默认选） */
    const onXdChange = (t) => { const o = linkOptsOf(t.xd); t.xk = ''; t.grade = ''; };
    const tagOpts = {
      xd: ['小学', '初中', '高中', '学前教育', '中职'],
    };
    const ElMsg = (window.ElementPlus && window.ElementPlus.ElMessage) || window.ElMessage;
    /* 英语词库音频：词条类型 + 应用场景（按钮式单选），单表单不分套 */
    const wtag = reactive({ dtype: '', scene: '' });
    const wdtypeOpts = ['单词', '短语', '谚语'];
    const wsceneOpts = ['英式发音', '美式发音', '例句音频', '译文音频', '词组音频', '教材例句音频', '联想记忆音频'];
    /* 古诗文音频：作品类型 + 应用场景（按钮式单选） */
    const gtag = reactive({ wtype: '', scene: '' });
    const gwtypeOpts = ['诗', '词', '赋', '散曲', '文言文'];
    const gsceneOpts = ['全文音频', '分段音频', '译文音频'];
    /* 蓝卡副标题：随已选标签以 · 分隔汇总 */
    const cardSub = computed(() => {
      if (rtype.value === '古诗文音频') return [gtag.wtype, gtag.scene].filter(Boolean).join(' · ');
      return [wtag.dtype, wtag.scene].filter(Boolean).join(' · ');
    });
    /* 名称/简介失焦后滚动位置回到文字开头 */
    const onCellBlur = (e) => { const el = e.target; if (el) { el.scrollLeft = 0; el.scrollTop = 0; } };
    /* 点击完成：名称必填；英语词库音频另校验词条类型/应用场景 */
    const onFinish = () => {
      const empty = rows.filter((r) => !r.name || !String(r.name).trim());
      if (empty.length) { ElMsg.warning(`还有 ${empty.length} 个音频未填写名称`); return; }
      if (rtype.value === '英语词库音频') {
        if (!wtag.dtype) { ElMsg.warning('请选择词条类型'); return; }
        if (!wtag.scene) { ElMsg.warning('请选择应用场景'); return; }

        if (!gtag.wtype) { ElMsg.warning('请选择作品类型'); return; }
        if (!gtag.scene) { ElMsg.warning('请选择应用场景'); return; }
      }
      ElMsg.success('校验通过，已完成');
    };
    return { rtype, batchEdit, batchVisible, confirmBatch, cancelBatch, toggleBatch, types, row, rows, curIdx, tags, addTag, delTag, setAllTags, tagOpts, onXdChange, linkOpts: linkOptsOf, wtag, wdtypeOpts, wsceneOpts, gtag, gwtypeOpts, gsceneOpts, cardSub, icons, onFinish, onCellBlur };

/* ---------------- 上传成功页（独立组件，按 cfg 渲染，每种资源字段不同） ---------------- */
const SuccessPage = {
  props: { cfg: { type: Object, required: true }, cfgKey: { type: String, default: 'video' } },
  emits: ['switch'],
  setup(props) {
    const crumbs = computed(() => ['内容资产库', '基础资源库', props.cfg.name]);
    const typeMeta = computed(() => TYPE_META[props.cfgKey] || TYPE_META.video);
    const rtype = ref(typeMeta.value.def);
    Vue.watch(() => props.cfgKey, (k) => { rtype.value = (TYPE_META[k] || TYPE_META.video).def; });

    const rows = reactive([Object.assign({ id: 1 }, props.cfg.sample)]);
    const remove = (r) => { const i = rows.indexOf(r); if (i > -1) rows.splice(i, 1); };

    let bSeed = 1;
    const buildBasic = () => { const o = { id: bSeed, open: false }; props.cfg.basicFields.forEach((f) => { o[f.label] = ''; }); return o; };
    const basicRows = reactive([buildBasic()]);
    const setAllBasic = (open) => basicRows.forEach((r) => { r.open = open; });
    const addBasic = () => { bSeed++; const r = buildBasic(); r.open = true; basicRows.push(r); };
    const removeBasic = (r) => { const i = basicRows.indexOf(r); if (i > -1) basicRows.splice(i, 1); };

    const ext = reactive({});
    props.cfg.extFields.forEach((f) => { ext[f.label] = f.type === 'checkbox' ? (f.def ? f.def.slice() : []) : (f.def || f.options[0]); });

    const form = reactive({});
    props.cfg.formFields.forEach((f) => { form[f.label] = ''; });

    const cellClass = (c) => {
      if (c.type === 'status') return 'cell-status';
      if (['size', 'format', 'dimension', 'pages', 'hours', 'duration'].includes(c.key)) return 'cell-size';
      if (c.key === 'name') return 'cell-name';
      return '';
    };

    return { crumbs, typeMeta, rtype, rows, remove, basicRows, setAllBasic, addBasic, removeBasic, ext, form, cellClass, icons };
  },
  template: `
    <div class="breadcrumb">
      <template v-for="(c, i) in crumbs" :key="c">
        <span>{{ c }}</span><span v-if="i < crumbs.length - 1" class="sep">/</span>

      <table class="file-table">

        </thead>
        <tbody>
          <tr v-for="(r, i) in rows" :key="r.id">
            <td>{{ i + 1 }}</td>
            <td v-for="c in cfg.columns" :key="c.key" :class="cellClass(c)">
              <template v-if="c.type === 'cover'"><span class="cover"></span></template>
              <template v-else-if="c.type === 'select'">
                <select class="sel" :class="{ filled: r[c.key] }" v-model="r[c.key]">
                  <option v-for="op in c.options" :key="op" :value="op">{{ op }}</option>
                </select>
              </template>
              <template v-else-if="c.type === 'status'">{{ r[c.key] }}</template>
              <template v-else-if="c.type === 'op'"><a @click="remove(r)">删除</a></template>
              <template v-else>{{ r[c.key] }}</template>

      <div class="sec-title mt-lg"><span>内容标签</span></div>
      <div class="tag-panels">
        <div class="tag-panel">

            <div class="panel-acts">
              <button class="btn-ghost" @click="setAllBasic(true)">全部展开</button>
              <button class="btn-ghost" @click="setAllBasic(false)">全部收起</button>

          </div>
          <div v-if="!basicRows.length" class="basic-empty">暂无基础信息，点击「新增」添加</div>
          <div v-for="r in basicRows" :key="r.id" class="basic-row">
            <div class="basic-line">
              <span class="q" v-html="icons.info"></span>
              <span class="basic-item" v-for="f in cfg.basicFields" :key="f.label"><b>{{ f.label }}:</b>{{ r[f.label] }}</span>
              <span class="basic-act">
                <span class="exp" @click="r.open = !r.open">{{ r.open ? '收起' : '展开' }}</span>
                <span class="del" @click="removeBasic(r)">删除</span>
              </span>
            </div>
            <div v-if="r.open" class="basic-edit">
              <label class="fe" v-for="f in cfg.basicFields" :key="f.label"><b>{{ f.label }}:</b>
                <select class="sel" :class="{ filled: r[f.label] }" v-model="r[f.label]">

  `,

/* ---------------- 资源上传流程（通用，按 RES_CONFIG 渲染，每种资源不同） ---------------- */
const ResourceUpload = {
  components: { UploadZone, AudioEdit, VideoEdit, ImageEdit, LessonEdit, CoursewareEdit, PlanEdit, VideoUpload, AudioUpload, ImageUpload, LessonUpload, CoursewareUpload, PlanUpload, VideoSuccess, AudioSuccess, ImageSuccess, LessonSuccess, CoursewareSuccess, PlanSuccess, SuccessPage },
  props: { cfgKey: { type: String, required: true } },
  setup(props) {
    const cfg = RES_CONFIG[props.cfgKey] || RES_CONFIG.video;
    const route = VueRouter.useRoute();
    const router = VueRouter.useRouter();
    // 页内状态走路由 query：视频/音频/图片/学案/课件/教案资源默认列表页，其它资源默认上传页；?p=success/edit/upload/list 指定页
    const page = computed(() => {
      const p = route.query.p;
      if (p === 'success' || p === 'edit' || p === 'upload' || p === 'list') return p;
      return ['video', 'audio', 'image', 'lesson', 'courseware', 'plan'].includes(props.cfgKey) ? 'upload' : 'upload';
    });
    const isUpload = computed(() => page.value === 'upload');
    const isEdit = computed(() => page.value === 'edit');
    const isList = computed(() => page.value === 'list');
    const switchPage = (key) => {
      // 仅音频有页内编辑页；其它资源编辑页走 video.html（原型占位）
      if (key === 'edit' && !['audio', 'video', 'image', 'lesson', 'courseware', 'plan'].includes(props.cfgKey)) { window.location.href = 'video.html'; return; }
      router.push({ path: route.path, query: { p: key } });
    };

    /* 列表页「批量编辑」弹窗：复用对应资源的成功页内容标签区 */
    const batchEditOpen = ref(false);
    const batchCfgKey = ref(props.cfgKey);
    const BATCH_NAME = { video: '视频', audio: '音频', image: '图片', lesson: '学案', courseware: '课件', plan: '教案' };
    const batchTitle = computed(() => '批量编辑' + (BATCH_NAME[batchCfgKey.value] || ''));
    const onBatchEdit = () => { batchCfgKey.value = props.cfgKey; batchEditOpen.value = true; };
    /* 各资源可参与批量的标签字段（键名对应成功页标签对象） */
    const BATCH_FIELDS = {
      video: [['vtype', '视频类别'], ['teacher', '讲师'], ['xd', '学段'], ['xk', '学科'], ['grade', '年级'], ['ver', '适用版本'], ['crowd', '适用人群'], ['level', '适用难度'], ['goals', '学习目标'], ['fmt', '制作形式'], ['layout', '视频版式']],
      audio: [['xd', '学段'], ['xk', '学科'], ['grade', '年级'], ['teacher', '讲师']],
      lesson: [['xd', '学段'], ['xk', '学科'], ['ltype', '学案类型'], ['grade', '年级'], ['ver', '适用版本'], ['term', '适用学期']],
      courseware: [['xd', '学段'], ['xk', '学科'], ['ctype', '课件类型'], ['grade', '年级'], ['ver', '适用版本'], ['term', '适用学期']],
      plan: [['xd', '学段'], ['xk', '学科'], ['ptype', '教案类型'], ['grade', '年级'], ['ver', '版本'], ['term', '适用学期']],
      image: [['dtype', '词条类型'], ['scene', '应用场景'], ['wtype', '作品类型'], ['wdynasty', '朝代'], ['wscene', '场景']],
    };
    const batchFields = computed(() => BATCH_FIELDS[batchCfgKey.value] || []);
    const batchSel = ref([]);
    watch([batchEditOpen, batchCfgKey], () => {
      if (batchEditOpen.value) batchSel.value = batchFields.value.map((f) => f[0]);
    }, { immediate: true });
    const ElMsg = (window.ElementPlus && window.ElementPlus.ElMessage) || window.ElMessage;
    const onBatchConfirm = () => {
      if (!batchSel.value.length) { ElMsg.warning('请至少选择一个标签字段'); return; }
      ElMsg.success('已对所选资源的 ' + batchSel.value.length + ' 个标签字段应用批量标签');
      batchEditOpen.value = false;
    };

    return { cfg, page, isUpload, isEdit, switchPage, batchEditOpen, batchCfgKey, batchTitle, onBatchEdit, batchFields, batchSel, onBatchConfirm };
  },
  template: `
    <section class="main">
      <div class="page-card" :class="{ 'edit-mode': isEdit, 'video-edit': isEdit && cfgKey === 'video', 'img-edit': isEdit && cfgKey === 'image', 'lesson-edit': isEdit && (cfgKey === 'lesson' || cfgKey === 'plan'), 'courseware-edit': isEdit && cfgKey === 'courseware', 'card-hug': (isUpload && cfgKey === 'video') || page === 'success' }">
        <image-edit v-if="isEdit && cfgKey === 'image'" @back="switchPage('success')" />
        <lesson-edit v-else-if="isEdit && cfgKey === 'lesson'" @back="switchPage('success')" />
        <plan-edit v-else-if="isEdit && cfgKey === 'plan'" @back="switchPage('success')" />

        <lesson-upload v-else-if="isUpload && cfgKey === 'lesson'" />
        <courseware-upload v-else-if="isUpload && cfgKey === 'courseware'" />
        <plan-upload v-else-if="isUpload" />
        <video-success v-else-if="cfgKey === 'video'" />
        <audio-success v-else-if="cfgKey === 'audio'" />
        <image-success v-else-if="cfgKey === 'image'" />
        <lesson-success v-else-if="cfgKey === 'lesson'" />
        <courseware-success v-else-if="cfgKey === 'courseware'" />
        <plan-success v-else-if="cfgKey === 'plan'" />
        <success-page v-else :cfg="cfg" :cfg-key="cfgKey" @switch="switchPage" />

      </div>

              <li>分为【讲师信息】区、【基础信息】区和【拓展信息】区；</li>

              <li>【拓展信息】区的标签及交互与编辑页一致，但上传【课程视频】的「适用难度」和「学习目标」、【等级考试视频】的「适用难度」设置为非必填；</li>

/* ---------------- 原型页面切换器 ---------------- */
const PageSwitcher = {
  props: { page: { type: String, default: 'upload' } },
  emits: ['switch'],
  setup() {
    const pages = [
      { key: 'upload', label: '上传页' },
      { key: 'success', label: '上传成功页' },
      { key: 'edit', label: '编辑页' },
    ];
    return { pages };
  },
  methods: {
    go(key) {
      // 编辑页跳转由各页面自行决定（音频 → 页内 ?p=edit；其它 → video.html）
      this.$emit('switch', key);
    },
  },
  template: `
    <div class="proto-nav">
      <span class="lb">页面切换</span>
      <button v-for="p in pages" :key="p.key"
              :class="{ 'is-active': page === p.key }" @click="go(p.key)">{{ p.label }}</button>
    </div>
  `,
};

/* ---------------- 路由与根组件 ---------------- */
const routes = [
  { path: '/', redirect: '/video' },
  { path: '/video', component: ResourceUpload, props: { cfgKey: 'video' } },
  { path: '/audio', component: ResourceUpload, props: { cfgKey: 'audio' } },
  { path: '/image', component: ResourceUpload, props: { cfgKey: 'image' } },
  { path: '/lesson-plan', component: ResourceUpload, props: { cfgKey: 'lesson' } },
  { path: '/courseware', component: ResourceUpload, props: { cfgKey: 'courseware' } },
  { path: '/teaching-plan', component: ResourceUpload, props: { cfgKey: 'plan' } },
  { path: '/:pathMatch(.*)*', redirect: '/video' },
];
const router = VueRouter.createRouter({
  history: VueRouter.createWebHashHistory(),
  routes,
});

const App = {
  components: { TopBar, SideMenu },
  template: `
    <div class="shell">
      <top-bar />
      <div class="layout">
        <side-menu />
        <router-view />
      </div>
    </div>
  `,
};

createApp(App)
  .use(router)
  .use(ElementPlus)
  .component('PageSwitcher', PageSwitcher) // 全局注册：视频页内使用，其它资源页不显示
  .mount('#app');
</script>
